upstream kokoriko_api {
    server 127.0.0.1:4223;
}

server {
    listen 80;
    server_name kokorikobackend.yingr-ai.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://kokoriko_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://kokoriko_api;
    }

    # Logs
    access_log /var/log/nginx/kokorikobackend.access.log;
    error_log /var/log/nginx/kokorikobackend.error.log;
}

